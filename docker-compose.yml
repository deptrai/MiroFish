services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

  mirofish-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mirofish-mcp
    depends_on:
      - mirofish
    environment:
      MIROFISH_API_URL: http://mirofish:5001
    ports:
      - "8901:8901"
    command: ["python", "mcp_server.py", "--transport", "sse", "--port", "8901"]
    restart: unless-stopped
